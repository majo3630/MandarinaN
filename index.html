<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Tareas de Otoño</title>
<style>
:root{--bg:#1a0f0a;--card:#2a1810;--line:#4a2e1f;--cream:#f5e6d3;--mute:#b89a82;--calabaza:#e8751a;--ambar:#f2a93b;--borgona:#8c2f39;--musgo:#6b7a3a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font:16px/1.4 system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:520px;margin:auto;padding:16px}
h1{font-size:24px;color:var(--ambar)}h2{font-size:15px;color:var(--mute);margin:16px 0 8px;font-weight:600}
.sub{color:var(--mute);font-size:14px}.cap{text-transform:capitalize}
.bar{height:8px;background:var(--line);border-radius:8px;margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--calabaza),var(--ambar));transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--calabaza);flex:none;display:grid;place-items:center;font-size:16px}
.done .chk{background:var(--musgo);border-color:var(--musgo)}
.done .t{text-decoration:line-through;opacity:.7}
.t{flex:1}.t small{display:block;color:var(--mute)}
.card img{width:48px;height:48px;object-fit:cover;border-radius:10px}
input[type=time]{color-scheme:dark;min-height:48px;font-size:20px;text-align:center}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:12px;padding:12px;font:inherit;margin-bottom:8px}
button{background:var(--calabaza);color:#1a0f0a;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700}
button.g{background:var(--line);color:var(--cream)}button.s{padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:12px 2px;font-size:10px}
nav button.on{color:var(--ambar)}
.sw{display:flex;gap:10px;margin-bottom:10px}.sw label{flex:1;height:40px;font-size:12px;font-weight:700;color:#1a0f0a}
.sw input{display:none}.sw input:checked+span{outline:3px solid var(--cream);outline-offset:2px}
.sw label span{width:100%;height:100%;border-radius:10px;display:grid;place-items:center}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;padding:14px;border-radius:14px;font-weight:700;color:#1a0f0a;z-index:9;transform:translateY(-160%);transition:transform .35s;box-shadow:0 8px 24px #0008}
#toast.show{transform:none}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:6px}.thumbs img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.empty{color:var(--mute);text-align:center;padding:24px}
#view{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:8}#view img{max-width:92%;max-height:80%;border-radius:12px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin:14px 0}.seg button{flex:1;background:none;color:var(--mute);padding:8px}.seg button.on{background:var(--calabaza);color:#1a0f0a}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.nav2 button{padding:6px 14px}
.big{font-size:56px;font-weight:800;color:var(--ambar);line-height:1}
.chart{display:flex;gap:3px;height:150px;margin-top:16px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}.bw{flex:1;display:flex;align-items:flex-end}
.col i{display:block;width:100%;min-height:3px;background:linear-gradient(0deg,var(--calabaza),var(--ambar));border-radius:4px 4px 0 0}
.col i.nil{background:var(--line)}.col span{font-size:9px;color:var(--mute);height:14px;text-align:center;margin-top:3px;overflow:hidden}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;color:var(--ambar)}
.card img.av{width:44px;height:44px;border-radius:50%}
.av.big,.card img.av.big{width:96px;height:96px;font-size:38px;margin:auto}
.rg{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.rg .top{display:flex;gap:10px;align-items:center}
.rg img{width:48px;height:48px;object-fit:cover;border-radius:10px}
.card.bad{background:rgba(255,45,70,.2);border-color:#ff4757;box-shadow:0 0 16px rgba(255,71,87,.6),inset 0 0 12px rgba(255,71,87,.25)}
.card.warn{border-color:var(--ambar);background:rgba(242,169,59,.12)}
.card.ok{border-color:var(--musgo)}
.face{font-size:28px;line-height:1;flex:none;width:34px;text-align:center}
.tp{width:100%;margin-bottom:8px;text-align:left}
#clk{position:fixed;inset:0;background:#000c;display:none;place-items:center;z-index:10;padding:16px}
.cb{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:340px}
.ct{font-size:12px;color:var(--mute);letter-spacing:1px;margin-bottom:10px}
.cd{display:flex;align-items:center;justify-content:center;gap:4px;font-size:52px;font-weight:800;margin-bottom:14px;line-height:1}
.cd span{padding:6px 12px;border-radius:12px;background:var(--line);color:var(--cream)}
.cd span.on{background:var(--calabaza);color:#1a0f0a}
.ap{display:flex;flex-direction:column;gap:4px;margin-left:8px}
.ap button{padding:6px 10px;font-size:14px;background:var(--line);color:var(--cream)}
.ap button.on{background:var(--calabaza);color:#1a0f0a}
#cf{width:100%;max-width:260px;display:block;margin:0 auto 14px;touch-action:none}
</style>
</head>
<body>
<div id="toast"></div>
<main id="app"></main>
<nav id="nav" style="display:none">
 <button data-v="hoy" class="on">🍂<br>Hoy</button>
 <button data-v="pro">📈<br>Progreso</button>
 <button data-v="reg">📒<br>Registro</button>
 <button data-v="usr">👥<br>Personas</button>
 <button data-v="eq" id="eqb" style="display:none">👥<br>Equipo</button>
 <button data-v="aj">⚙️<br>Ajustes</button>
</nav>
<input type="file" id="file" accept="image/*" capture="environment" hidden>
<input type="file" id="pfile" accept="image/*" hidden>
<div id="view" onclick="this.style.display='none'"><img></div>
<div id="clk"><div class="cb"><div class="ct">SELECCIONA LA HORA</div>
<div class="cd"><span id="ch" data-act="cmode" data-m="h"></span><b>:</b><span id="cm" data-act="cmode" data-m="m"></span><div class="ap"><button id="cam" data-act="cap" data-p="0">AM</button><button id="cpm" data-act="cap" data-p="1">PM</button></div></div>
<svg id="cf" viewBox="-110 -110 220 220"></svg>
<div class="row"><button class="g s" data-act="cclear">Sin hora</button><button class="g s" data-act="ccancel">Cancelar</button><button class="s" data-act="cok">OK</button></div></div></div>

<script type="module">
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>typeof u==='string'&&/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(u)?u:'';
const nameKey=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,40);
const cleanName=n=>String(n||'').replace(/\s+/g,' ').trim().slice(0,24);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const THEMES={calabaza:'#e8751a',ambar:'#f2a93b',borgona:'#c4505c',musgo:'#8fa04a'};
/* ===== TUS DATOS: pega aquí el firebaseConfig de la app web (NO la clave de servicio) ===== */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyChBfufHiwa6cDOjIkDv66rtoimcixPefs",
  authDomain:"mandarinanotas.firebaseapp.com",
  projectId:"mandarinanotas",
  storageBucket:"mandarinanotas.firebasestorage.app",
  messagingSenderId:"578281064114",
  appId:"1:578281064114:web:1aeba7ebc224224da26bab"
};
const VAPID_KEY=''; // pega aquí la clave pública de Firebase > Configuración > Cloud Messaging > Certificados push web
const GITHUB={owner:'',repo:'',token:''}; // opcional; el botón de GitHub solo aparece si hay token
const fmt=d=>d.toLocaleDateString('en-CA');
const today=()=>fmt(new Date());
const hhmm=()=>new Date().toTimeString().slice(0,5);
const t12=h=>{if(!h)return'';const [H,M]=h.split(':').map(Number);return `${H%12||12}:${String(M).padStart(2,'0')} ${H<12?'AM':'PM'}`};
const timePick=id=>`<button type="button" class="g tp" id="${id}" data-act="clock">🕐 ${draft[id]?t12(draft[id]):'Sin hora'}</button>`;
const fbErr=e=>{const c=e?.code||'';toast(
  c.includes('permission')?'Sin permiso en Firestore: publica las reglas en la consola de Firebase':
  (c==='timeout'||c.includes('unavailable')||c.includes('not-found')||c.includes('failed-precondition'))?'Firestore no responde: crea la base de datos y revisa que las reglas estén publicadas':
  'Error: '+(e?.message||c),'borgona')};
const snap=(r,fn)=>fb.F.onSnapshot(r,fn,fbErr);
const W=(p,ms=8000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))]);
const readTime=id=>draft[id]||'';
let clock={},entering=false,nameChecked=false,rper='dia',roff=0,hoySig='';

let peer={uid:null,date:null,tasks:[],logs:[]},peerUn=[];
let all={users:[],tasks:[],logs:[]},draft={},me=null,ready=false,tasks=[],logs=[],fb=null,unsubs=[],view='hoy',pending=null,pendDate=null,authMode='login',per='sem',off=0;

/* ---------- Inicio y usuarios ---------- */
async function init(){
  const cfg=FIREBASE_CONFIG;
  if(cfg){
    try{
      const b='https://www.gstatic.com/firebasejs/10.12.2/';
      const [A,F,S,U]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-firestore.js'),import(b+'firebase-storage.js'),import(b+'firebase-auth.js')]);
      const app=A.initializeApp(cfg);
      let M=null;try{const m=await import(b+'firebase-messaging.js');if(await m.isSupported())M=m}catch{}
      fb={F,S,U,M,msg:M?M.getMessaging(app):null,db:F.getFirestore(app),st:S.getStorage(app),auth:U.getAuth(app)};
      U.onAuthStateChanged(fb.auth,u=>{
        unsubs.forEach(x=>x());unsubs=[];tasks=[];logs=[];all={users:[],tasks:[],logs:[]};peerUn.forEach(x=>x());peerUn=[];peer={uid:null,date:null,tasks:[],logs:[]};
        nameChecked=false;me=u?{uid:u.uid,name:u.displayName||'Usuario',photo:'',admin:false}:null;
        if(me){
          subscribe();
          if(window.Notification&&Notification.permission==='granted')enablePush(true).catch(()=>{});
        }
        ready=true;render();
      });
    }catch(e){fb=null;toast('Error con Firebase: '+e.message,'borgona')}
  }
  if(!fb){me=LS('me',null);if(me)loadLocal();ready=true;render()}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function subscribe(){
  const {F,db}=fb;
  const q=n=>F.query(F.collection(db,n),F.where('uid','==',me.uid));
  unsubs=[snap(q('tasks'),s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));refresh()}),
          snap(q('logs'),s=>{logs=s.docs.map(d=>({id:d.id,...d.data()}));refresh()}),
          snap(F.query(F.collection(db,'avisos'),F.where('toUid','==',me.uid),F.where('seen','==',false)),s=>s.docChanges().forEach(c=>{
            if(c.type==='added'){const x=c.doc.data();fire(x.title,x.body,x.theme);F.updateDoc(c.doc.ref,{seen:true})}})),
          snap(F.doc(db,'users',me.uid),s=>{if(!s.exists()){if(!entering)ensureProfile()}else if(!nameChecked){nameChecked=true;ensureName()}const x=s.data()||{};if(x.name)me.name=x.name;me.photo=x.photo||'';const a=!!x.admin;if(a&&!me.admin){me.admin=true;subAdmin()}if(!a)me.admin=false;refresh()}),
          snap(F.collection(db,'users'),s=>{all.users=s.docs.map(d=>({id:d.id,uid:d.id,...d.data()}));refresh()})];
}
function subAdmin(){
  const {F,db}=fb;
  ['tasks','logs'].forEach(n=>unsubs.push(snap(F.collection(db,n),s=>{all[n]=s.docs.map(d=>({id:d.id,...d.data()}));refresh()})));
}
function openPeer(uid,date){
  peerUn.forEach(x=>x());peerUn=[];peer={uid,date,tasks:[],logs:[]};
  if(uid&&fb){
    const {F,db}=fb;
    peerUn=[snap(F.query(F.collection(db,'tasks'),F.where('uid','==',uid)),s=>{peer.tasks=s.docs.map(d=>({id:d.id,...d.data()}));refresh()}),
            snap(F.query(F.collection(db,'logs'),F.where('uid','==',uid),F.where('date','==',date)),s=>{peer.logs=s.docs.map(d=>({id:d.id,...d.data()}));refresh()})];
  }
  render();
}
function refresh(){if(document.activeElement?.matches('input,textarea,select'))return;render()}
function loadLocal(){
  all={users:LS('users',[]),tasks:LS('tasks',[]),logs:LS('logs',[])};
  if(all.users.length&&!all.users.some(u=>u.admin)){all.users[0].admin=true;SV('users',all.users)}
  me.admin=!!all.users.find(u=>u.uid===me.uid)?.admin;
  const mu=all.users.find(u=>u.uid===me.uid);if(mu){me.name=mu.name;me.photo=mu.photo||''}
  tasks=all.tasks.filter(t=>t.uid===me.uid);logs=all.logs.filter(l=>l.uid===me.uid);
}
async function enter(name,existing){
  if(fb){
    const nm=cleanName(name),k=nameKey(nm);
    if(!k)throw new Error('Usa letras o números en tu nombre');
    entering=true;
    try{
      const c=await fb.U.signInAnonymously(fb.auth);
      try{await fb.F.setDoc(fb.F.doc(fb.db,'names',k),{uid:c.user.uid})}
      catch(e){await fb.U.deleteUser(c.user).catch(()=>fb.U.signOut(fb.auth));throw new Error('Ese nombre ya está en uso. Elige otro.')}
      await fb.U.updateProfile(c.user,{displayName:nm});
      await fb.F.setDoc(fb.F.doc(fb.db,'users',c.user.uid),{uid:c.user.uid,name:nm,photo:''},{merge:true});
    }finally{entering=false}
    return;
  }
  const users=LS('users',[]);let u=existing&&users.find(x=>x.uid===existing);
  if(!u){const nm=cleanName(name),k=nameKey(nm);if(!k)throw new Error('Usa letras o números en tu nombre');if(users.some(x=>nameKey(x.name)===k))throw new Error('Ese nombre ya está en uso. Elige otro.');u={uid:'u'+Date.now(),name:nm,photo:'',admin:users.length===0};users.push(u);SV('users',users)}
  me={uid:u.uid,name:u.name,photo:u.photo||'',admin:!!u.admin};SV('me',me);loadLocal();view='hoy';render();
}
async function saveProfile(name,photo){
  if(name!=null){
    name=cleanName(name);const k=nameKey(name),old=nameKey(me.name);
    if(!k)throw new Error('Usa letras o números en tu nombre');
    if(k!==old){
      if(all.users.some(u=>u.uid!==me.uid&&nameKey(u.name)===k))throw new Error('Ese nombre ya está en uso. Elige otro.');
      if(fb){
        try{await fb.F.setDoc(fb.F.doc(fb.db,'names',k),{uid:me.uid})}catch(e){throw new Error('Ese nombre ya está en uso. Elige otro.')}
        fb.F.deleteDoc(fb.F.doc(fb.db,'names',old)).catch(()=>{});
      }
    }
    me.name=name;
  }
  if(photo!=null)me.photo=photo;
  if(fb){
    await fb.F.setDoc(fb.F.doc(fb.db,'users',me.uid),{name:me.name,photo:me.photo||''},{merge:true});
    fb.U.updateProfile(fb.auth.currentUser,{displayName:me.name}).catch(()=>{});
  }else{
    const u=LS('users',[]).map(x=>x.uid===me.uid?{...x,name:me.name,photo:me.photo||''}:x);SV('users',u);SV('me',me);loadLocal();
  }
  render();
}
async function ensureProfile(){
  try{
    const {F,db}=fb,u=me.uid;
    const d=await F.getDoc(F.doc(db,'deleted',u));
    if(d.exists()){toast('Un administrador eliminó tu perfil','borgona');await fb.U.signOut(fb.auth);return}
    await F.setDoc(F.doc(db,'users',u),{uid:u,name:me.name,photo:''},{merge:true});
    ensureName();
  }catch(e){fbErr(e)}
}
async function ensureName(){
  try{
    const {F,db}=fb,k=nameKey(me.name);if(!k)return;
    const r=F.doc(db,'names',k),d=await F.getDoc(r);
    if(!d.exists())await F.setDoc(r,{uid:me.uid});
    else if(d.data().uid!==me.uid)toast('Otra persona ya usa tu nombre. Cámbialo en Ajustes','borgona');
  }catch(e){}
}
async function delUser(u){
  if(fb){
    const {F,db}=fb,nr=F.doc(db,'names',nameKey(u.name));
    await F.setDoc(F.doc(db,'deleted',u.uid),{at:Date.now()});
    await Promise.all([
      ...all.tasks.filter(t=>t.uid===u.uid).map(t=>F.deleteDoc(F.doc(db,'tasks',t.id))),
      ...all.logs.filter(l=>l.uid===u.uid).map(l=>F.deleteDoc(F.doc(db,'logs',l.id))),
      F.deleteDoc(F.doc(db,'tokens',u.uid)).catch(()=>{}),
      F.getDoc(nr).then(d=>d.exists()&&d.data().uid===u.uid?F.deleteDoc(nr):null).catch(()=>{}),
      F.deleteDoc(F.doc(db,'users',u.uid))
    ]);
  }else{
    SV('users',LS('users',[]).filter(x=>x.uid!==u.uid));
    SV('tasks',LS('tasks',[]).filter(x=>x.uid!==u.uid));
    SV('logs',LS('logs',[]).filter(x=>x.uid!==u.uid));
    loadLocal();render();
  }
}
async function enablePush(silent){
  if(!fb?.M||!('Notification' in window))throw new Error('Este navegador no permite notificaciones');
  if(!VAPID_KEY)throw new Error('Falta pegar la clave VAPID en el código');
  const perm=Notification.permission==='granted'?'granted':await Notification.requestPermission();
  if(perm!=='granted')throw new Error('Permiso bloqueado. Actívalo en los ajustes del navegador');
  const reg=await navigator.serviceWorker.ready;
  const token=await fb.M.getToken(fb.msg,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
  if(!token)throw new Error('No se pudo activar en este celular');
  await fb.F.setDoc(fb.F.doc(fb.db,'tokens',me.uid),{uid:me.uid,tokens:fb.F.arrayUnion(token),updated:Date.now()},{merge:true});
  if(!silent){toast('Notificaciones activadas 🔔','musgo');render()}
}
async function selfDelete(){
  if(fb){
    const {F,db}=fb,u=me.uid,nr=F.doc(db,'names',nameKey(me.name));
    entering=true;
    try{
      await Promise.all([
        ...tasks.map(t=>F.deleteDoc(F.doc(db,'tasks',t.id))),
        ...logs.map(l=>F.deleteDoc(F.doc(db,'logs',l.id))),
        F.deleteDoc(F.doc(db,'tokens',u)).catch(()=>{}),
        F.getDoc(nr).then(d=>d.exists()&&d.data().uid===u?F.deleteDoc(nr):null).catch(()=>{})
      ]);
      await F.deleteDoc(F.doc(db,'users',u));
      await fb.U.deleteUser(fb.auth.currentUser).catch(()=>fb.U.signOut(fb.auth));
    }finally{entering=false}
  }else{
    const u=me.uid;
    SV('users',LS('users',[]).filter(x=>x.uid!==u));
    SV('tasks',LS('tasks',[]).filter(x=>x.uid!==u));
    SV('logs',LS('logs',[]).filter(x=>x.uid!==u));
    me=null;tasks=[];logs=[];localStorage.removeItem('me');render();
  }
}
async function logout(){
  if(fb){if(!confirm('Si sales, no podrás volver a entrar con este perfil ni con este nombre, a menos que un administrador lo elimine. ¿Salir?'))return;return fb.U.signOut(fb.auth)}
  me=null;tasks=[];logs=[];localStorage.removeItem('me');render();
}

/* ---------- Datos por usuario ---------- */
async function addTask(title,time,to){
  const t={title,time,uid:to||me.uid,createdAt:today()};
  if(to&&to!==me.uid){t.from=me.name;t.fromUid=me.uid}
  if(fb)return W(fb.F.addDoc(fb.F.collection(fb.db,'tasks'),t));
  const all=LS('tasks',[]);all.push({id:'t'+Date.now(),...t});SV('tasks',all);loadLocal();render();
}
async function delTask(id){
  if(fb)return W(fb.F.deleteDoc(fb.F.doc(fb.db,'tasks',id)));
  SV('tasks',LS('tasks',[]).filter(t=>t.id!==id));loadLocal();render();
}
async function updTask(id,data){
  if(fb)return W(fb.F.updateDoc(fb.F.doc(fb.db,'tasks',id),data));

async function setLog(taskId,date,data){
  const id=date+'_'+taskId;
  if(fb)return W(fb.F.setDoc(fb.F.doc(fb.db,'logs',id),{uid:me.uid,taskId,date,...data},{merge:true}));
  const all=LS('logs',[]),i=all.findIndex(l=>l.id===id);
  if(i<0)all.push({id,uid:me.uid,taskId,date,...data});else all[i]={...all[i],...data};
  SV('logs',all);loadLocal();render();
}
async function delLog(taskId,date){
  const id=date+'_'+taskId;
  if(fb)return W(fb.F.deleteDoc(fb.F.doc(fb.db,'logs',id)));
  SV('logs',LS('logs',[]).filter(l=>l.id!==id));loadLocal();render();
}
function compress(file,max=1000,q=.72){
  return new Promise(res=>{
    const img=new Image();img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(res,'image/jpeg',q);
    };img.src=URL.createObjectURL(file);
  });
}
const toUrl=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function upload(file,taskId,date){
  // La foto se guarda reducida dentro de Firestore: no necesita Storage ni plan de pago.
  const url=await toUrl(await compress(file,800,.65));
  if(url.length>900000)throw new Error('La foto es muy pesada, intenta con otra');
  return url;
}

/* ---------- Avisos ---------- */
function toast(msg,theme='calabaza'){
  const t=$('#toast');t.textContent=msg;t.style.background=THEMES[theme]||THEMES.calabaza;
  t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),5000);
}
async function sys(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{const r=await navigator.serviceWorker.getRegistration();r?r.showNotification(title,{body,tag:title}):new Notification(title,{body})}
  catch{try{new Notification(title,{body})}catch{}}
}
async function sendAviso(toUid,title,body,theme){
  const a={toUid,title,body,theme,seen:false,from:me.name,at:Date.now()};
  if(fb)return fb.F.addDoc(fb.F.collection(fb.db,'avisos'),a);
  const all2=LS('avisos',[]);all2.push({id:'a'+Date.now()+Math.random(),...a});SV('avisos',all2);
}
function checkAvisos(){
  if(fb||!me)return;
  const l=LS('avisos',[]);let ch=false;
  l.forEach(x=>{if(x.toUid===me.uid&&!x.seen){x.seen=true;ch=true;fire(x.title,x.body,x.theme)}});
  if(ch)SV('avisos',l);
}
function fire(title,body,theme){toast(`${title}${body?' · '+body:''}`,theme);sys(title,body)}
setInterval(()=>{
  if(!me)return;
  if(!fb){loadLocal();checkAvisos();if(view==='eq')refresh()}
  const now=hhmm(),d=today();
  if(view==='hoy'){const sg=d+tasks.map(t=>stat(t).k).join('');if(sg!==hoySig){hoySig=sg;refresh()}}
  const fk='fired_'+me.uid+'_'+d,fired=LS(fk,[]);
  tasks.forEach(t=>{
    if(t.time===now&&!fired.includes(t.id)&&!logs.find(l=>l.taskId===t.id&&l.date===d&&l.done)){
      fired.push(t.id);SV(fk,fired);fire('Tarea pendiente',t.title,'ambar');
    }
  });
},20000);

/* ---------- GitHub ---------- */
async function gh(date){
  const g=GITHUB;
  if(!g.token||!g.owner||!g.repo)return toast('GitHub no está configurado','borgona');
  const data=tasks.map(t=>{const l=logs.find(x=>x.taskId===t.id&&x.date===date);
    return{tarea:t.title,hecha:!!l?.done,hora:l?.at||null,evidencia:l?.img&&!l.img.startsWith('data:')?l.img:null}});
  const slug=(me.name.toLowerCase().replace(/[^a-z0-9]/g,'')||'usuario')+'-'+me.uid.slice(-4);
  const u=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/registro/${slug}/${date}.json`;
  const h={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  try{
    const r=await fetch(u,{headers:h});const s=r.ok?(await r.json()).sha:undefined;
    const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:`Registro ${slug} ${date}`,sha:s,
      content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))})});
    toast(p.ok?'Registro subido a GitHub ✔':'GitHub respondió '+p.status,p.ok?'musgo':'borgona');
  }catch(e){toast('Sin conexión con GitHub','borgona')}
}

/* ---------- Progreso ---------- */
function groups(){
  const t=new Date();t.setHours(0,0,0,0);
  const day=(y,m,d)=>fmt(new Date(y,m,d));
  if(per==='sem'){
    const s=new Date(t);s.setDate(t.getDate()-((t.getDay()+6)%7)+off*7);
    const ds=[...Array(7)].map((_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return x});
    return{title:`${fmt(ds[0]).slice(5)} al ${fmt(ds[6]).slice(5)}`,g:ds.map(x=>({l:x.toLocaleDateString('es',{weekday:'short'}).slice(0,2),days:[fmt(x)]}))};
  }
  if(per==='mes'){
    const f=new Date(t.getFullYear(),t.getMonth()+off,1),n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
    return{title:f.toLocaleDateString('es',{month:'long',year:'numeric'}),g:[...Array(n)].map((_,i)=>({l:(i+1)%5===1?String(i+1):'',days:[day(f.getFullYear(),f.getMonth(),i+1)]}))};
  }
  const y=t.getFullYear()+off;
  return{title:String(y),g:[...Array(12)].map((_,m)=>{const n=new Date(y,m+1,0).getDate();
    return{l:new Date(y,m,1).toLocaleDateString('es',{month:'short'}).slice(0,3),days:[...Array(n)].map((_,i)=>day(y,m,i+1))}})};
}
function stats(){
  const {title,g}=groups(),td=today();let D=0,E=0;
  const out=g.map(x=>{let d=0,e=0;
    x.days.forEach(ds=>{if(ds>td)return;
      e+=tasks.filter(t=>!t.createdAt||t.createdAt<=ds).length;
      d+=logs.filter(l=>l.date===ds&&l.done&&tasks.some(t=>t.id===l.taskId)).length});
    D+=d;E+=e;return{l:x.l,p:e?Math.round(Math.min(d,e)/e*100):null}});
  return{title,out,D,E,pct:E?Math.round(Math.min(D,E)/E*100):0};
}

function pendHtml(){
  const {g}=groups(),td=today(),out=[];
  g.forEach(x=>x.days.forEach(ds=>{if(ds>td)return;
    tasks.filter(t=>(!t.createdAt||t.createdAt<=ds)&&!logs.find(l=>l.taskId===t.id&&l.date===ds&&l.done)).forEach(t=>out.push({d:ds,t:t.title}))}));
  out.sort((a,b)=>b.d.localeCompare(a.d));
  return`<h2>Tareas sin completar (${out.length})</h2>`+(out.slice(0,40).map(x=>`<div class="card" style="border-left:6px solid ${x.d===td?'var(--ambar)':'var(--borgona)'}"><div class="t">${esc(x.t)}<small>${x.d===td?'Hoy · aún pendiente':x.d}</small></div></div>`).join('')||'<p class="empty">¡Completaste todo en este periodo! 🎉</p>')+(out.length>40?'<p class="sub">Mostrando las 40 más recientes.</p>':'');
}
function stat(t){
  const n=new Date(),[H,M]=t.time?t.time.split(':').map(Number):[23,59],diff=H*60+M-(n.getHours()*60+n.getMinutes());
  if(diff<0)return{k:'bad',f:'😡',diff};
  if(diff<=60)return{k:'warn',f:'😟',diff};
  return{k:'ok',f:'😊',diff};
}
const left=m=>m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;

}

    ${fb&&fb.M?`<h2>Notificaciones</h2><button class="g" style="width:100%" data-act="push">${window.Notification&&Notification.permission==='granted'?'🔔 Activadas (toca para renovar)':'🔔 Activar notificaciones'}</button>`:''}
    <p class="sub" style="margin-top:12px">${fb?'🟢 Conectado a Firebase':'🟠 Modo local (sin Firebase)'}</p>
    ${me.admin?'':`<h2>Eliminar mi cuenta</h2><button class="g" style="width:100%;color:#ff8a94" data-act="selfdel">🗑 Eliminar mi cuenta</button><p class="sub" style="margin-top:6px">Se borran tu perfil, tus tareas y tus fotos. Se cierra la sesión y tendrás que registrarte de nuevo.</p>`}
    ${me.admin?`<h2>Administrar usuarios</h2>${all.users.filter(u=>u.uid!==me.uid).map(u=>`<div class="card">${av(u)}<div class="t">${esc(u.name)}</div><button class="g s" data-act="deluser" data-id="${esc(u.uid)}">🗑 Eliminar</button></div>`).join('')||'<p class="empty">No hay otros usuarios.</p>'}`:''}`;
  }
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}

/* ---------- Eventos ---------- */
document.addEventListener('click',async e=>{
  const nv=e.target.closest('#nav button');if(nv){view=nv.dataset.v;return render()}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=today();
  if(a==='enter'){const nm=$('#an').value.trim();if(!nm)return toast('Escribe tu nombre','borgona');try{await enter(nm)}catch(err){toast(err.message,'borgona')}}
  if(a==='pick')enter(null,b.dataset.id);
  if(a==='avatar')$('#pfile').click();
  if(a==='savename'){const n=$('#pn').value.trim();if(n){try{await saveProfile(n);toast('Nombre actualizado','musgo')}catch(err){toast(err.message||'No se pudo guardar','borgona')}}}
  if(a==='peer')openPeer(b.dataset.id,today());
  if(a==='peerback')openPeer(null,null);
  if(a==='pstep'){const x=new Date(peer.date+'T00:00:00');x.setDate(x.getDate()+ +b.dataset.n);const nd=fmt(x);if(nd<=today())openPeer(peer.uid,nd)}
  if(a==='logout')logout();
  if(a==='avisar'){draft.to=b.dataset.u;render();scrollTo(0,0)}
  if(a==='sendav'){
    if(!draft.to||!(draft.t||draft.b))return toast('Elige usuario y escribe el aviso','borgona');
    await sendAviso(draft.to,draft.t||'Aviso',draft.b||'',draft.th||'calabaza');toast('Aviso enviado ✔','musgo');draft={};render();
  }
  if(a==='remind'){
    let n=0;
    for(const u of all.users){
      const p=all.tasks.filter(t=>t.uid===u.uid&&(!t.createdAt||t.createdAt<=d)&&!all.logs.some(l=>l.uid===u.uid&&l.taskId===t.id&&l.date===d&&l.done)).length;
      if(p){await sendAviso(u.uid,'Tareas pendientes',`Tienes ${p} tarea(s) por terminar hoy`,'ambar');n++}
    }
    toast(n?`Recordatorio enviado a ${n} persona(s)`:'Nadie tiene pendientes','musgo');
  }
  if(a==='per'){per=b.dataset.p;off=0;render()}
  if(a==='step'){off+=+b.dataset.n;if(off>0)off=0;render()}
  if(a==='tap'){pending=b.dataset.id;pendDate=b.dataset.d||null;$('#file').click()}
  if(a==='rfoto'){pending=b.dataset.id;pendDate=b.dataset.d;$('#file').click()}
  if(a==='rdel'&&confirm('¿Eliminar este registro? La tarea volverá a aparecer en Hoy.'))delLog(b.dataset.id,b.dataset.d).then(()=>toast('Registro eliminado','musgo')).catch(fbErr);
  if(a==='add'){
    const t=$('#nt').value.trim(),to=$('#nto').value||me.uid;
    if(t){try{
      const tm=readTime('nh');draft.nh='';await addTask(t,tm,to);
      if(to!==me.uid)sendAviso(to,'Nueva tarea',`${me.name} te puso: ${t}`,'ambar').catch(()=>{});
      draft.nto=to;toast(to===me.uid?'Tarea guardada':'Tarea enviada ✔','musgo');
    }catch(e){fbErr(e)}}
  }
  if(a==='rper'){rper=b.dataset.p;roff=0;render()}
  if(a==='rstep'){roff+=+b.dataset.n;if(roff>0)roff=0;render()}
  if(a==='rday'){const x=new Date(b.dataset.d+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);rper='dia';roff=Math.min(0,Math.round((x-t)/864e5));render();scrollTo(0,0)}
  if(a==='push')enablePush(false).catch(err=>toast(err.message||'No se pudo activar','borgona'));
  if(a==='selfdel'&&confirm('¿Eliminar tu cuenta? Se borran tu perfil, tus tareas y tus fotos. Tendrás que registrarte de nuevo.')){
    try{await selfDelete();toast('Cuenta eliminada. Regístrate de nuevo para entrar.','musgo')}catch(err){fbErr(err)}
  }
  if(a==='deluser'){
    const u=all.users.find(x=>x.uid===b.dataset.id);
    if(u&&u.uid!==me.uid&&confirm('¿Eliminar a '+u.name+'? Se borran también sus tareas y registros.')){
      try{await delUser(u);toast('Usuario eliminado','musgo')}catch(err){fbErr(err)}
    }
  }
  if(a==='clock')openClock(b.id);
  if(a==='cmode'){clock.mode=b.dataset.m;drawClock()}
  if(a==='cap'){clock.pm=b.dataset.p==='1';drawClock()}
  if(a==='cclear')setTime(clock.id,'');
  if(a==='ccancel')$('#clk').style.display='none';
  if(a==='cok'){const H=(clock.h%12)+(clock.pm?12:0);setTime(clock.id,String(H).padStart(2,'0')+':'+String(clock.m).padStart(2,'0'))}
  if(a==='edit'){draft.edit=b.dataset.id;draft.eh=tasks.find(x=>x.id===b.dataset.id)?.time||'';render()}
  if(a==='ecancel'){draft.edit=null;render()}
  if(a==='esave'){
    const t=$('#et').value.trim();if(!t)return toast('Escribe el nombre de la tarea','borgona');
    try{await updTask(b.dataset.id,{title:t,time:readTime('eh')});draft.edit=null;render();toast('Tarea actualizada','musgo')}catch(err){fbErr(err)}
  }
  if(a==='del'&&confirm('¿Eliminar esta tarea?'))delTask(b.dataset.id).then(()=>toast('Tarea eliminada','musgo')).catch(fbErr);
  if(a==='gh')gh(b.dataset.d);
  if(a==='zoom'){$('#view img').src=b.src;$('#view').style.display='grid'}
});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='av-to')draft.to=e.target.value;if(i==='av-t')draft.t=e.target.value;if(i==='av-b')draft.b=e.target.value;if(i==='nto')draft.nto=e.target.value});
document.addEventListener('change',e=>{if(e.target.name==='ath')draft.th=e.target.value});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!pending)return;
  const id=pending,ed=pendDate,d=ed||today();pending=null;pendDate=null;toast('Subiendo foto…','ambar');
  try{
    const img=await upload(f,id,d);
    const ex=logs.some(l=>l.taskId===id&&l.date===d&&l.done);
    await setLog(id,d,ex?{img}:{done:true,img,at:hhmm()});
    toast(ex?'Foto actualizada 📷':'¡Tarea terminada! 🍁','musgo');
  }catch(err){fbErr(err)}
});
$('#pfile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{await saveProfile(null,await toUrl(await compress(f,256,.8)));toast('Foto actualizada','musgo')}catch(err){toast(err.message,'borgona')}
});
/* ---------- Reloj para elegir la hora ---------- */
function setTime(id,v){draft[id]=v;const b=document.getElementById(id);if(b)b.textContent='🕐 '+(v?t12(v):'Sin hora');$('#clk').style.display='none'}
function openClock(id){
  const v=draft[id],n=new Date();let H=n.getHours(),M=n.getMinutes();
  if(v){[H,M]=v.split(':').map(Number)}
  clock={id,h:H%12||12,m:M,pm:H>=12,mode:'h',drag:false};
  $('#clk').style.display='grid';drawClock();
}
function drawClock(){
  const c=clock,hr=c.mode==='h',a=(hr?(c.h%12)*30:c.m*6)*Math.PI/180,x=78*Math.sin(a),y=-78*Math.cos(a);
  let n='';
  for(let i=0;i<12;i++){
    const v=hr?(i||12):i*5,b=i*Math.PI/6,sel=hr?c.h===v:c.m===v;
    n+=`<text x="${78*Math.sin(b)}" y="${-78*Math.cos(b)}" text-anchor="middle" dominant-baseline="central" style="font:600 16px system-ui;fill:${sel?'#1a0f0a':'#f5e6d3'}">${hr?v:String(v).padStart(2,'0')}</text>`;
  }
  const odd=!hr&&c.m%5!==0;
  $('#cf').innerHTML=`<circle r="105" style="fill:#1a0f0a"/><line x1="0" y1="0" x2="${x}" y2="${y}" stroke="#e8751a" stroke-width="2"/><circle r="4" fill="#e8751a"/><circle cx="${x}" cy="${y}" r="19" fill="#e8751a"/>${odd?`<circle cx="${x}" cy="${y}" r="3" fill="#1a0f0a"/>`:''}${n}`;
  $('#ch').textContent=String(c.h).padStart(2,'0');$('#cm').textContent=String(c.m).padStart(2,'0');
  $('#ch').classList.toggle('on',hr);$('#cm').classList.toggle('on',!hr);
  $('#cam').classList.toggle('on',!c.pm);$('#cpm').classList.toggle('on',c.pm);
}
{
  const cf=$('#cf');
  const mv=e=>{const r=cf.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),g=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;
    if(clock.mode==='h')clock.h=Math.round(g/30)%12||12;else clock.m=Math.round(g/6)%60;drawClock()};
  cf.addEventListener('pointerdown',e=>{cf.setPointerCapture(e.pointerId);clock.drag=true;mv(e)});
  cf.addEventListener('pointermove',e=>{if(clock.drag)mv(e)});
  const up=()=>{if(!clock.drag)return;clock.drag=false;if(clock.mode==='h'){clock.mode='m';drawClock()}};
  cf.addEventListener('pointerup',up);cf.addEventListener('pointercancel',up);
}
init();
</script>
